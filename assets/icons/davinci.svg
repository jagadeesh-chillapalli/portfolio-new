<svg xmlns="http://www.w3.org/2000/svg" width="852" height="852" viewBox="0 0 852 852">
  <defs>
    <!-- Outer multicolor rounded frame -->
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44d9c5"/>
      <stop offset="22%" stop-color="#16bde7"/>
      <stop offset="48%" stop-color="#8db8df"/>
      <stop offset="67%" stop-color="#c65d91"/>
      <stop offset="82%" stop-color="#f83e49"/>
      <stop offset="100%" stop-color="#ffdc00"/>
    </linearGradient>

    <!-- Inner panel -->
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#263e57"/>
      <stop offset="100%" stop-color="#1d3147"/>
    </linearGradient>

    <!-- Top shape -->
    <radialGradient id="topFill" cx="50%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#18d8f2"/>
      <stop offset="45%" stop-color="#19c5e4"/>
      <stop offset="73%" stop-color="#55c6bd"/>
      <stop offset="100%" stop-color="#d8b3a7"/>
    </radialGradient>

    <!-- Left shape -->
    <radialGradient id="leftFill" cx="45%" cy="28%" r="88%">
      <stop offset="0%" stop-color="#f5ffb0"/>
      <stop offset="40%" stop-color="#d7f326"/>
      <stop offset="72%" stop-color="#b8d81c"/>
      <stop offset="100%" stop-color="#f3ad18"/>
    </radialGradient>

    <!-- Right shape -->
    <radialGradient id="rightFill" cx="47%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#ffe1df"/>
      <stop offset="35%" stop-color="#f7a7ad"/>
      <stop offset="68%" stop-color="#f34250"/>
      <stop offset="100%" stop-color="#f47c31"/>
    </radialGradient>

    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#071321" flood-opacity=".65"/>
    </filter>

    <filter id="shapeShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#081421" flood-opacity=".72"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Transparent background -->
  <g filter="url(#outerShadow)">
    <rect x="14" y="14" width="824" height="824" rx="151" fill="url(#frame)"/>
    <rect x="65" y="62" width="722" height="724" rx="105" fill="#16283c"/>
    <rect x="69" y="66" width="714" height="716" rx="99" fill="url(#panel)"/>
  </g>

  <!-- Very subtle inner rim -->
  <rect x="69" y="66" width="714" height="716" rx="99"
        fill="none" stroke="#102236" stroke-width="6" opacity=".65"/>

  <!-- Top teardrop -->
  <g filter="url(#shapeShadow)">
    <path d="M426 163
             C367 163 316 211 315 270
             C314 323 350 378 401 426
             C411 436 421 438 426 435
             C431 438 441 436 451 426
             C502 378 538 323 537 270
             C536 211 485 163 426 163 Z"
          fill="url(#topFill)"/>
    <ellipse cx="426" cy="250" rx="91" ry="75" fill="#9ceaff" opacity=".18" filter="url(#softGlow)"/>
  </g>

  <!-- Left petal -->
  <g filter="url(#shapeShadow)">
    <path d="M159 536
             C160 477 207 435 270 435
             C313 435 362 443 397 456
             C411 461 414 470 411 484
             C403 537 381 594 351 625
             C322 655 281 662 244 658
             C195 653 158 611 159 536 Z"
          fill="url(#leftFill)"/>
    <ellipse cx="273" cy="500" rx="110" ry="66" fill="#ffffd2" opacity=".20" filter="url(#softGlow)"/>
  </g>

  <!-- Right petal -->
  <g filter="url(#shapeShadow)">
    <path d="M693 536
             C692 477 645 435 582 435
             C539 435 490 443 455 456
             C441 461 438 470 441 484
             C449 537 471 594 501 625
             C530 655 571 662 608 658
             C657 653 694 611 693 536 Z"
          fill="url(#rightFill)"/>
    <ellipse cx="579" cy="500" rx="110" ry="66" fill="#fff0ee" opacity=".18" filter="url(#softGlow)"/>
  </g>
</svg>